name: my_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  file_picker: 8.3.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  geolocator: 14.0.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
    android: true
    ios: false
    image_path: "icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/1st_Floor.png
    - assets/1st_Floorr.png
    - assets/2nd_Floor.png
    - assets/2nd_Floorr.png
    - assets/exterior_1.png
    - assets/exterior_2.png
    - assets/exteriorr.png
    - assets/exteriorrr.png
    - assets/interiorr.png
    - assets/interiorrr.png
    - assets/login_pic.png
    - assets/screen.png
    - assets/screen.png
    - assets/app_icon.png